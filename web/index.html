<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jean Clawd</title>
<link rel="icon" href="favicon.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand" data-action="view" data-view="today">
      <canvas id="logo" width="32" height="56"></canvas>
      <div>
        <div class="brand-name">Jean Clawd</div>
        <div class="brand-sub" id="brandSub">planning, with muscle</div>
      </div>
    </div>

    <nav class="nav" id="tabs">
      <button data-action="view" data-view="today" data-group="plan">
        <svg viewBox="0 0 20 20"><rect x="3" y="4" width="14" height="13" rx="2.5"/><path d="M3 8.5h14M7 2.5v3M13 2.5v3"/><rect x="6.5" y="11" width="3" height="3" rx=".6" fill="currentColor" stroke="none"/></svg>
        <span>Planning</span><kbd>T</kbd>
      </button>
      <button data-action="view" data-view="crew">
        <svg viewBox="0 0 20 20"><circle cx="7" cy="7" r="2.6"/><circle cx="14" cy="8" r="2.1"/><path d="M2.5 16c.4-2.8 2.2-4.4 4.5-4.4s4.1 1.6 4.5 4.4M11.8 12.3c.7-.5 1.4-.7 2.2-.7 1.9 0 3.2 1.3 3.5 3.6"/></svg>
        <span>Crew</span><span class="nbadge" id="crewBadge" hidden></span><kbd>C</kbd>
      </button>
      <button data-action="view" data-view="playbook">
        <svg viewBox="0 0 20 20"><path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H15v12H5.5A1.5 1.5 0 0 0 4 16.5z"/><path d="M4 16.5A1.5 1.5 0 0 0 5.5 18H15v-3M7.5 6.5h4.5M7.5 9h3"/></svg>
        <span>Playbook</span><kbd>B</kbd>
      </button>
      <a class="navlink" href="/dojo.html" title="The Dojo: watch the crew on the floor">
        <svg viewBox="0 0 20 20"><path d="M3 12.5L10 16l7-3.5L10 9z"/><path d="M3 12.5V8L10 4.5 17 8v4.5M10 9v7"/></svg>
        <span>Dojo</span><kbd>D</kbd>
      </a>
      <button data-action="view" data-view="projects">
        <svg viewBox="0 0 20 20"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H8l1.5 1.5H15.5A1.5 1.5 0 0 1 17 8v7a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 3 15z"/></svg>
        <span>Projects</span><kbd>P</kbd>
      </button>
      <button data-action="view" data-view="settings">
        <svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="2.6"/><path d="M10 2.8v2M10 15.2v2M2.8 10h2M15.2 10h2M4.9 4.9l1.4 1.4M13.7 13.7l1.4 1.4M4.9 15.1l1.4-1.4M13.7 6.3l1.4-1.4"/></svg>
        <span>Settings</span><kbd>,</kbd>
      </button>
    </nav>

    <div class="side-section">
      <div class="side-label">Projects</div>
      <div class="side-projects" id="sideProjects"></div>
    </div>

    <div class="themeswitch" id="themeSwitch" role="group" aria-label="Theme">
      <button data-theme-set="system" title="Follow the Mac">Auto</button><button data-theme-set="light">Light</button><button data-theme-set="dark">Dark</button>
    </div>
    <div class="side-stats" id="stats"></div>
  </aside>

  <div class="content">
    <header class="topbar" id="controls"></header>
    <main id="main"></main>
  </div>
</div>

<div class="modal-backdrop" id="modal" hidden></div>
<div class="toast" id="toast" hidden></div>

<script src="sprite.js"></script>
<script src="app.js"></script>
</body>
</html>
